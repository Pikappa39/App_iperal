# Installazione su EC2:
#   sudo cp deploy/apache/myorari-security.conf /etc/apache2/conf-available/myorari-security.conf
#   sudo a2enconf myorari-security
#   sudo a2enmod headers rewrite
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
#
# La protezione non dipende da AllowOverride: blocca dati e repository anche
# se Apache non interpreta i file .htaccess.

<Directory "/var/www/html/App_iperal-1">
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

<DirectoryMatch "^/var/www/html/App_iperal-1/(?:\.git|storage|turni_json|note_json|xlms|scripts|database|deploy|vendor|gestore_ods)(?:/|$)">
    Require all denied
</DirectoryMatch>

<LocationMatch "^/(?:app_local_env\.php|connection_files/(?:connection|invite_lib|password_reset_mail|push_lib)\.php)$">
    Require all denied
</LocationMatch>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; trusted-types default goog#html;"
</IfModule>
